# Llama al workflow de checks del plugin fabrica, en la versión de este
# proyecto. Lo escribe fabrica-setup: se actualiza con `fabrica-setup refresh`.
name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: Ivans0198/fabrica-plugin/.github/workflows/checks.yml@v0.5.25
    with:
      fabrica_repo: Ivans0198/fabrica-plugin
      fabrica_ref: v0.5.25
    secrets:
      FABRICA_PLUGIN_TOKEN: ${{ secrets.FABRICA_PLUGIN_TOKEN }}
