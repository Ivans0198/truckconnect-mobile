# Llama al workflow de menciones a @claude del plugin fabrica, en la versión
# de este proyecto. Lo escribe fabrica-setup: se actualiza con
# `fabrica-setup refresh`.
#
# Credenciales, como secretos del repo: CLAUDE_TOKEN_<SU_USUARIO> por persona
# y, opcional, ANTHROPIC_API_KEY de equipo.
name: claude-mentions

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  mentions:
    uses: Ivans0198/fabrica-plugin/.github/workflows/claude-mentions.yml@v0.5.25
    with:
      fabrica_repo: Ivans0198/fabrica-plugin
      fabrica_ref: v0.5.25
    secrets: inherit
