# Llama al workflow de PRs en conflicto del plugin fabrica, en la versión de
# este proyecto. Lo escribe fabrica-setup: se actualiza con
# `fabrica-setup refresh`.
name: pr-conflicts

on:
  # Un merge mueve la rama principal y puede hacer chocar a los otros PRs.
  push:
  # GitHub no dispara pull_request en un PR que ya choca: esto solo quita la
  # etiqueta cuando el PR se resuelve.
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  conflicts:
    uses: Ivans0198/fabrica-plugin/.github/workflows/pr-conflicts.yml@v0.5.29
    with:
      fabrica_repo: Ivans0198/fabrica-plugin
      fabrica_ref: v0.5.29
    secrets:
      FABRICA_PLUGIN_TOKEN: ${{ secrets.FABRICA_PLUGIN_TOKEN }}
