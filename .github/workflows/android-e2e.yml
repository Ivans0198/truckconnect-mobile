# Llama al workflow del e2e nativo en Android del plugin fabrica, en la
# versión de este proyecto. Lo escribe fabrica-setup cuando el proyecto tiene
# flows de Maestro (.maestro/): se actualiza con `fabrica-setup refresh`.
#
# Corre si factory.json define commands.androidBuild, androidServe,
# androidE2e y androidApk. Con commands.androidFingerprint, un PR que no toca
# la parte nativa usa el APK de la caché y tarda unos 7 minutos de Actions;
# compilar suma entre 10 y 20.
#
# En main corre al mergear: las cachés que deja ahí las ven todos los PRs.
name: android-e2e

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo al PR cancela la corrida anterior: no tiene sentido terminar
# 20 minutos de emulador sobre un commit viejo. En main no: la corrida a
# medias es la que deja la caché.
concurrency:
  group: android-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    uses: Ivans0198/fabrica-plugin/.github/workflows/android-e2e.yml@v0.5.30
    with:
      fabrica_repo: Ivans0198/fabrica-plugin
      fabrica_ref: v0.5.30
    secrets:
      FABRICA_PLUGIN_TOKEN: ${{ secrets.FABRICA_PLUGIN_TOKEN }}
