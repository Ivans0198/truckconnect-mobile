# Llama al workflow de etiquetas y épicas del plugin fabrica, en la versión de
# este proyecto. Lo escribe fabrica-setup: se actualiza con
# `fabrica-setup refresh`.
name: labels-cleanup

on:
  issues:
    types: [closed, reopened]
  schedule:
    # Higiene diaria: solo hace algo si alguien enganchó a mano un sub-issue a
    # una épica ya cerrada.
    - cron: "17 6 * * *"

permissions:
  contents: read
  issues: write

jobs:
  labels:
    uses: Ivans0198/fabrica-plugin/.github/workflows/labels-cleanup.yml@v0.5.27
    with:
      fabrica_repo: Ivans0198/fabrica-plugin
      fabrica_ref: v0.5.27
    secrets:
      FABRICA_PLUGIN_TOKEN: ${{ secrets.FABRICA_PLUGIN_TOKEN }}
