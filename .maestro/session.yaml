# La sesión sobrevive a un reinicio: entra, cierra la app, la abre sin
# clearState y llega a Home sin pasar por el login. Prueba el secure store
# nativo, que jest y Playwright no tocan.
#
# Corre con `pnpm e2e:android` (emulador o teléfono por USB, dev build
# instalado con `pnpm android`, Metro corriendo con `pnpm start`). No necesita
# back: sin EXPO_PUBLIC_API_URL, el dev build responde con los mocks de
# src/mocks y el conductor de prueba de src/mocks/dev-auth-handlers.ts.
# Fuera del gate a propósito: ver CLAUDE.md → Testing layers.
appId: au.com.truckconnect.driver
env:
  DEV_CLIENT_LINK: "exp+truckconnect-driver://?__expo_url=http%3A%2F%2Flocalhost%3A8081&__expo_disable_fab=1&__expo_disable_auto_launch=1&__expo_disable_onboarding=1"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Development Build"
    timeout: 60000
- openLink: ${DEV_CLIENT_LINK}
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 180000
- tapOn: "Email"
- inputText: driver@truckconnect.test
- tapOn: "Password"
- inputText: driver-password
- hideKeyboard
- tapOn: "Sign in"
# "Fatigue" solo existe en la tab bar, que solo se ve con sesión: el login no
# la tiene.
- extendedWaitUntil:
    visible: "Fatigue"
    timeout: 30000
# Reinicio: se mata la app y se vuelve a abrir SIN clearState.
- stopApp
- launchApp
# Sin clearState el dev client reabre el último bundle por su cuenta y muestra
# su menú de herramientas encima: no pasa por el launcher y el menú tapa la
# pantalla. Se espera al menú y se cierra con Atrás.
- extendedWaitUntil:
    visible: "Reload"
    timeout: 120000
- pressKey: back
# Primera aserción tras el reinicio: un texto que solo tiene Home con sesión.
- extendedWaitUntil:
    visible: "Fatigue"
    timeout: 180000
- assertNotVisible: "Welcome back"
