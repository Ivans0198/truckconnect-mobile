# Cerrar sesión desde Profile. Corre con `pnpm e2e:android`, con el emulador
# (o el teléfono por USB) conectado, el dev build instalado (`pnpm android`),
# Metro corriendo. No necesita back: sin EXPO_PUBLIC_API_URL, el dev build
# responde con los mocks de src/mocks y el conductor de prueba de
# src/mocks/dev-auth-handlers.ts.
# Fuera del gate a propósito: ver CLAUDE.md → Testing layers.
appId: au.com.truckconnect.driver
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Development Build"
    timeout: 60000
- openLink: "exp+truckconnect-driver://?__expo_url=http%3A%2F%2Flocalhost%3A8081&__expo_disable_fab=1&__expo_disable_auto_launch=1&__expo_disable_onboarding=1"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 180000
# Entra con el conductor de prueba de los mocks.
- tapOn: "Email"
- inputText: driver@truckconnect.test
- tapOn: "Password"
- inputText: driver-password
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 30000
# Profile -> Log out -> confirmar.
- tapOn: "Profile"
- tapOn: "Log out"
- assertVisible: "Log out?"
# El diálogo es un modal: con él abierto, solo su botón es accesible.
- tapOn: "Log out"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
# Reabrir la app sigue en el login: no quedó sesión guardada.
- stopApp
- launchApp
# Sin clearState el dev client reabre el último bundle por su cuenta y muestra
# su menú de herramientas encima: no pasa por el launcher y el menú tapa la
# pantalla. Se espera al menú y se cierra con Atrás.
- extendedWaitUntil:
    visible: "Reload"
    timeout: 120000
- pressKey: back
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000
