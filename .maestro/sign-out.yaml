# Cerrar sesión desde Profile. Corre con `pnpm e2e:android`, con el emulador
# (o el teléfono por USB) conectado, el dev build instalado (`pnpm android`),
# Metro corriendo y el back alcanzable desde la app (EXPO_PUBLIC_API_URL).
# Fuera del gate a propósito: ver CLAUDE.md → Testing layers.
#
# Variables: MAESTRO_DRIVER_EMAIL y MAESTRO_DRIVER_PASSWORD, de un conductor
# ACTIVE del back al que apunta la app (maestro test -e NAME=value).
appId: au.com.truckconnect.driver
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Development Build"
    timeout: 60000
- openLink: "exp+truckconnect-driver://?__expo_url=http%3A%2F%2Flocalhost%3A8081&__expo_disable_fab=1&__expo_disable_auto_launch=1&__expo_disable_onboarding=1"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 180000
# Entra con un conductor real.
- tapOn: "Email"
- inputText: ${MAESTRO_DRIVER_EMAIL}
- tapOn: "Password"
- inputText: ${MAESTRO_DRIVER_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 30000
# Profile -> Log out -> confirmar.
- tapOn: "Profile"
- tapOn: "Log out"
- assertVisible: "Log out?"
- tapOn:
    text: "Log out"
    index: 1
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
# Reabrir la app sigue en el login: no quedó sesión guardada.
- stopApp
- launchApp
- openLink: "exp+truckconnect-driver://?__expo_url=http%3A%2F%2Flocalhost%3A8081&__expo_disable_fab=1&__expo_disable_auto_launch=1&__expo_disable_onboarding=1"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000
